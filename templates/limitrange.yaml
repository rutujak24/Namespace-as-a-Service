apiVersion: v1
kind: LimitRange
metadata:
  name: {{ name }}-lr
spec:
  limits:
  - default:
      memory: {{ default_memory | default('512Mi') }}
      cpu: "{{ default_cpu | default('500m') }}"
    defaultRequest:
      memory: {{ request_memory | default('256Mi') }}
      cpu: "{{ request_cpu | default('250m') }}"
    type: Container
