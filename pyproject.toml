[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "namespace-as-a-service"
version = "0.1.0"
description = "Minimal Namespace-as-a-Service CLI"
authors = [
  { name = "Rutuja" }
]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "click",
  "kubernetes",
  "PyYAML",
  "python-dotenv",
]
